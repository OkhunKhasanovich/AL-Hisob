name: Server ops

# Ручные безопасные операции на VPS по SSH (ключ — в секретах GitHub, ни в чате, ни в коде).
# Выбирается ТОЛЬКО одно из заранее заданных действий: произвольные команды запустить нельзя.
# Результат смотрится в журнале запуска (Actions → Server ops → запуск → шаг «Run»).
on:
  workflow_dispatch:
    inputs:
      action:
        description: Что сделать на сервере
        type: choice
        required: true
        default: resources
        options:
          - install       # первая установка Al-Hisob на сервер (рядом с другими проектами)
          - add-swap      # добавить 1 ГБ подкачки (если её нет)
          - diagnose      # почему не пускает: отпечаток ключа и какие пользователи его принимают
          - resources     # память, диск, занятые порты (проверка перед установкой)
          - status        # контейнеры, nginx, версия кода
          - health        # ответ /health изнутри и снаружи
          - logs          # последние 200 строк журнала API
          - restart       # перезапуск API
          - set-webhook   # заново зарегистрировать вебхук Telegram-бота
      domain:
        description: Домен API (только для install)
        type: string
        required: false
        default: alhisob.myservices.uz
      email:
        description: Почта для уведомлений Let's Encrypt (только для install)
        type: string
        required: false
      bot_username:
        description: Имя бота без @ (только для install)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: server-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set (see docs/server-setup.md, section 5)"; exit 1; }
          done

      - name: Run
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          ACTION: ${{ inputs.action }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          DOMAIN_IN: ${{ inputs.domain }}
          EMAIL_IN: ${{ inputs.email }}
          BOT_USERNAME_IN: ${{ inputs.bot_username }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          remote() {
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "$@"
          }
          if [ "$ACTION" = diagnose ]; then
            # Диагностика входа: ничего на сервере не меняет, секреты не печатает.
            if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
              echo "KEY PROBLEM: the private key is unreadable (it has a passphrase, or the text was damaged while pasting)"
              exit 1
            fi
            echo "key type and fingerprint (compare with the panel / authorized_keys):"
            ssh-keygen -lf ~/.ssh/deploy_key.pub
            echo "public key (safe to copy; add it to authorized_keys on the server):"
            cat ~/.ssh/deploy_key.pub
            for u in root ubuntu deploy "$DEPLOY_USER"; do
              if ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
                   -o ConnectTimeout=10 -o IdentitiesOnly=yes "$u@$DEPLOY_HOST" true 2>/dev/null; then
                echo "login as '$u': ACCEPTED"
              else
                echo "login as '$u': denied"
              fi
            done
            exit 0
          fi
          case "$ACTION" in
            resources)
              remote 'echo "== memory"; free -h; echo "== disk"; df -h /; echo "== listening ports"; ss -ltn; echo "== os"; . /etc/os-release; echo "$PRETTY_NAME"; echo "== nginx sites"; ls /etc/nginx/sites-enabled 2>/dev/null || true' ;;
            status)
              remote 'cd /opt/al-hisob && git log -1 --oneline && cd deploy && docker compose ps && systemctl is-active nginx' ;;
            health)
              remote 'curl -fsS http://127.0.0.1:8000/health || true'; echo
              if [ -n "${API_DOMAIN:-}" ]; then curl -fsS "https://${API_DOMAIN}/health" || echo "public health check failed"; fi ;;
            logs)
              remote 'cd /opt/al-hisob/deploy && docker compose logs --tail 200 api' ;;
            restart)
              remote 'cd /opt/al-hisob/deploy && docker compose restart api && sleep 3 && docker compose ps' ;;
            set-webhook)
              remote 'cd /opt/al-hisob/deploy && docker compose exec -T api python -m app.cli set-webhook' ;;
            add-swap)
              remote 'if swapon --show | grep -q .; then echo "swap already present"; swapon --show; else sudo fallocate -l 1G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile && (grep -q "^/swapfile " /etc/fstab || echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab >/dev/null) && echo "swap added" && free -h; fi' ;;
            install)
              for v in DOMAIN_IN EMAIL_IN BOT_USERNAME_IN TELEGRAM_BOT_TOKEN; do
                [ -n "${!v}" ] || { echo "::error::$v is empty (domain, email and bot_username are inputs; TELEGRAM_BOT_TOKEN is a secret)"; exit 1; }
              done
              # 1. DNS: домен должен уже указывать на этот сервер, иначе сертификат не выдадут.
              resolved=$(getent hosts "$DOMAIN_IN" | awk '{print $1}' | head -n1 || true)
              if [ "$resolved" != "$DEPLOY_HOST" ]; then
                echo "::error::DNS: $DOMAIN_IN resolves to '${resolved:-nothing}', not to the server. Add the A record and wait a few minutes."
                exit 1
              fi
              echo "DNS ok: $DOMAIN_IN points to the server"
              # 2. Скрипт установки (из репозитория) и его запуск от root. Другие проекты на сервере не трогаются.
              remote 'curl -fsSL https://raw.githubusercontent.com/OkhunKhasanovich/Al-Hisob/main/deploy/bootstrap.sh -o /tmp/al-hisob-bootstrap.sh'
              remote "sudo env DOMAIN='$DOMAIN_IN' EMAIL='$EMAIL_IN' bash /tmp/al-hisob-bootstrap.sh"
              # 3. Токен бота и имя бота — в .env на сервере. Токен идёт по stdin, в командной строке его нет.
              PYCODE='import sys,re;p="/opt/al-hisob/deploy/.env";t=sys.stdin.readline().strip();u=sys.stdin.readline().strip();f=lambda s,k,v:re.sub("^"+k+"=.*$",lambda m:k+"="+v,s,flags=re.M) if re.search("^"+k+"=",s,re.M) else s+"\n"+k+"="+v+"\n";s=open(p).read();s=f(s,"TELEGRAM_BOT_TOKEN",t);s=f(s,"TELEGRAM_BOT_USERNAME",u);open(p,"w").write(s)'
              printf '%s\n%s\n' "$TELEGRAM_BOT_TOKEN" "$BOT_USERNAME_IN" | remote "sudo python3 -c '$PYCODE'"
              echo "bot settings written to .env"
              # 4. Запуск и вебхук.
              remote 'cd /opt/al-hisob/deploy && sudo docker compose up -d --build && sleep 8 && sudo docker compose ps'
              remote 'cd /opt/al-hisob/deploy && sudo docker compose exec -T api python -m app.cli set-webhook'
              sleep 3
              curl -fsS "https://$DOMAIN_IN/health" && echo && echo "INSTALLED: https://$DOMAIN_IN/health answers" ;;
            *) echo "::error::unknown action"; exit 1 ;;
          esac
