name: Android check

# Проверка сборки на рабочих ветках: без подписи и без отправки в Telegram.
# Релизная сборка с отправкой APK — build-apk.yml (только main).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Версия закреплена: «stable» без номера сам обновляется (3.50 потребовал новый Android Gradle
          # Plugin и сломал сборку). Переходить на новую версию — осознанно, вместе с проектом Android.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      # Кэш Gradle: зависимости и обёртка не скачиваются заново при каждой сборке.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

      # Release, как на main (R8, lint), но без подписи: подпись — только в build-apk.yml.
      - name: Build release APK (compiles Kotlin, runs R8 and lint)
        run: flutter build apk --release --target-platform android-arm64
