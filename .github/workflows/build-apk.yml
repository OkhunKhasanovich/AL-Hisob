name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # публикация релиза с APK для автообновления

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Лимит Telegram Bot API на файл — 50 МБ.
  MAX_APK_BYTES: 52428800

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Версия закреплена: «stable» без номера сам обновляется (3.50 потребовал новый Android Gradle
          # Plugin и сломал сборку). Переходить на новую версию — осознанно, вместе с проектом Android.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      # Кэш Gradle: зависимости и обёртка не скачиваются заново при каждой сборке.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dependencies
        run: flutter pub get

      - name: Code generation (drift)
        run: dart run build_runner build

      # Анализ и тесты проходят на рабочей ветке (Android check) до того, как код попадает в main,
      # поэтому здесь они только дублировали бы работу (~2 минуты). Включить: переменная RUN_TESTS_ON_MAIN = true.
      - name: Analyze
        if: vars.RUN_TESTS_ON_MAIN == 'true'
        run: flutter analyze

      - name: Test
        if: vars.RUN_TESTS_ON_MAIN == 'true'
        run: flutter test

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BUILD_NUMBER="${{ github.run_number }}" \
            --dart-define=APP_VERSION="${{ steps.ver.outputs.name }}" \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}"

      - name: Check APK size (Telegram limit is 50 MB)
        id: apk
        env:
          SEND_TO_TELEGRAM: ${{ vars.SEND_APK_TO_TELEGRAM }}
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          SIZE=$(stat -c %s "$APK")
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size_mb=$(awk "BEGIN{printf \"%.1f\", $SIZE/1048576}")" >> "$GITHUB_OUTPUT"
          # Лимит Telegram важен, только пока APK отправляется в Telegram.
          if [ "$SIZE" -ge "$MAX_APK_BYTES" ]; then
            if [ "$SEND_TO_TELEGRAM" = "true" ]; then
              echo "::error::APK is $SIZE bytes, Telegram limit is $MAX_APK_BYTES"
              exit 1
            fi
            echo "::warning::APK is $SIZE bytes: over the Telegram limit ($MAX_APK_BYTES), fine for in-app updates"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.ver.outputs.name }}+${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14

      # Отправка APK в Telegram выключена: приложение обновляется само (см. шаг «Publish GitHub release»).
      # Включить обратно: Settings → Secrets and variables → Actions → Variables → SEND_APK_TO_TELEGRAM = true.
      - name: Send APK to Telegram
        if: vars.SEND_APK_TO_TELEGRAM == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_SIZE_MB: ${{ steps.apk.outputs.size_mb }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s | cut -c1-300)
          CAPTION=$(printf 'Al-Hisob %s (сборка %s)\nCommit: %s\n%s\narm64-v8a, %s MB' \
            "$VERSION" "${{ github.run_number }}" "$SHORT_SHA" "$COMMIT_MSG" "$APK_SIZE_MB")
          RESPONSE=$(curl -sS --fail-with-body \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"$APK_PATH" \
            -F caption="$CAPTION")
          echo "$RESPONSE" | grep -q '"ok":true' || { echo "::error::Telegram rejected the upload"; exit 1; }

      # Приложение проверяет «последний релиз» и предлагает обновиться.
      # Имена файлов фиксированы: по ним приложение выбирает APK под архитектуру телефона.
      - name: Publish GitHub release (in-app updates)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.name }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "release/al-hisob-${abi}.apk"
          done
          NOTES=$(git log -1 --pretty=%s)
          gh release create "build-${RUN}" release/*.apk \
            --title "Al-Hisob ${VERSION} (${RUN})" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
          # Храним 10 последних релизов.
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes || true
          done

      - name: Notify Telegram about failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "?")
          TEXT=$(printf '❌ Сборка Al-Hisob #%s упала (%s)\n%s/%s/actions/runs/%s' \
            "${{ github.run_number }}" "$SHORT_SHA" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="$TEXT" \
            --data-urlencode disable_web_page_preview=true || true
